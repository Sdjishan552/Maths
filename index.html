<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<title>MindMath</title>
<style>
:root{--bg:#fff;--card:#fafaff;--tx:#1e2340;--mu:#6b7287;--pr:#6366f1;--ac:#f97316;--ok:#16a34a;--bad:#e11d48;--bd:#e8ebf5}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html,body{height:100%;margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);user-select:none}
#app{max-width:480px;margin:auto;height:100%;display:flex;flex-direction:column}
#main{flex:1;overflow:auto;padding:calc(env(safe-area-inset-top,0px) + 18px) 16px 16px}
h1{margin:0 0 4px;font-size:28px;letter-spacing:-.02em}
h3{margin:16px 0 8px;font-size:14px;color:var(--mu);font-weight:600}h3:first-child{margin-top:0}
.mu{color:var(--mu);font-size:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin:12px 0}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:4px 0}
.bar{height:8px;background:var(--bd);border-radius:9px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--ac);border-radius:9px;transition:width .3s}
.seg{display:flex;gap:6px}
.seg button{flex:1;padding:10px 4px;border:1px solid var(--bd);background:transparent;color:var(--tx);border-radius:10px;font-size:14px}
.seg .on{background:var(--pr);border-color:var(--pr);color:#fff}
.tg{width:48px;height:28px;border-radius:99px;border:0;background:var(--bd);position:relative;flex:none}
.tg:after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}
.tg.on{background:var(--pr)}.tg.on:after{left:23px}
.big{width:100%;padding:16px;border:0;border-radius:12px;background:var(--pr);color:#fff;font-size:17px;font-weight:600;margin-top:8px}
.ghost{width:100%;padding:14px;border:1px solid var(--bd);border-radius:12px;background:transparent;color:var(--tx);font-size:16px;margin-top:8px}
.q{font-size:52px;font-weight:700;text-align:center;margin:20px 0 10px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.ans{font-size:36px;text-align:center;min-height:64px;line-height:64px;border-radius:12px;background:var(--card);border:2px solid var(--bd);font-variant-numeric:tabular-nums}
.ans.ok{border-color:var(--ok);color:var(--ok)}.ans.bad{border-color:var(--bad);color:var(--bad)}
.hint{min-height:20px;text-align:center;font-size:13px;color:var(--ac);font-weight:600;margin-top:6px}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.pad button{padding:16px 0;font-size:24px;border:1px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx)}
.pad button:active{background:var(--bd)}.pad .go{background:var(--pr);color:#fff;border-color:var(--pr)}
nav{display:flex;border-top:1px solid var(--bd);background:var(--card);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;padding:10px;border:0;background:none;color:var(--mu);font-size:12px;display:flex;flex-direction:column;align-items:center;gap:3px}
nav .on{color:var(--pr);font-weight:700}nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}.grid .card{margin:0;text-align:center}
.n2{display:block;font-size:26px;font-weight:700}
.heat{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.cell{border:1px solid var(--bd);border-radius:10px;text-align:center;padding:6px 0}.cell b{display:block;font-size:18px}.cell small{font-size:10px;color:var(--mu)}
.trend{border-left:5px solid var(--bd)}.trend.up{border-left-color:var(--ok)}.trend.dn{border-left-color:var(--bad)}

h1{color:var(--pr)}
.card{box-shadow:0 2px 10px rgba(99,102,241,.08)}
.card.y{background:#fff8e1}.card.l{background:#f3f2ff}.card.g{background:#eafaf1}.card.b{background:#e8f4ff}.card.p{background:#fff0f5}.card.o{background:#fff1e6}
.grid .card:nth-child(1){background:#e8f4ff}.grid .card:nth-child(2){background:#fff1e6}.grid .card:nth-child(3){background:#eafaf1}.grid .card:nth-child(4){background:#f3f2ff}
.trend.up{background:#eafaf1}.trend.dn{background:#fff0f3}
.bar{background:#eceefb}.bar i{background:linear-gradient(90deg,#f97316,#ec4899)}
.seg button{background:#fff}.seg .on{background:#6366f1;border-color:#6366f1;color:#fff}
.big{background:linear-gradient(135deg,#6366f1,#8b5cf6);box-shadow:0 4px 12px rgba(99,102,241,.3)}
.q{background:#f3f2ff;border-radius:18px;padding:20px 0;color:#4338ca}
.ans{background:#fff;border-color:#c7d2fe}
.pad button:nth-child(3n+1){background:#e8f0ff}.pad button:nth-child(3n+2){background:#fdeaf4}.pad button:nth-child(3n){background:#e6f9ee}
.pad button.go{background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;border-color:#6366f1}
.pad button:active{filter:brightness(.92)}
nav{background:#fff}nav .on{color:#6366f1}
</style></head><body><div id="app"><div id="main"></div>
<nav><button data-v="home" class="on"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Practice</button>
<button data-v="stats"><svg viewBox="0 0 24 24"><path d="M5 20V11M12 20V4M19 20v-6"/></svg>Stats</button></nav></div>
<script>
const $=s=>document.querySelector(s),LS='mindmath.v1';
let S={h:[],set:{}};const DEF={op:'mix',d:2,goal:50,ai:true,len:10};
try{const x=JSON.parse(localStorage.getItem(LS));if(x)S=x}catch(e){}
S.h=S.h||[];S.set={...DEF,...S.set};
const save=()=>{try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}};
const dk=t=>new Date(t).toLocaleDateString('en-CA'),today=()=>dk(Date.now());
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1)),num=d=>d==1?rnd(1,9):rnd(10**(d-1),10**d-1);
// ---- tags: what kind of digits/steps a question contains
function tags(a,b,op){
  const t=new Set();[...String(a),...String(b)].forEach(c=>t.add('d'+c));t.add(op);
  let x=a,y=b,c=0,flag=false;
  while(x>0||y>0){const p=x%10,q=y%10;
    if(op=='+'){const s=p+q+c;c=s>=10?1:0}else{const s=p-q-c;c=s<0?1:0}
    if(c)flag=true;x=Math.floor(x/10);y=Math.floor(y/10)}
  t.add(flag?(op=='+'?'carry':'borrow'):'simple');t.add('s'+String(a).length+'x'+String(b).length);return t}
function agg(list){const m={};list.forEach(r=>tags(r.a,r.b,r.o).forEach(k=>{const e=m[k]||(m[k]={n:0,w:0,ms:0});e.n++;if(!r.ok)e.w++;e.ms+=r.ms}));return m}
function weakMap(){const rec=S.h.slice(-400),m=agg(rec),g=rec.length?rec.reduce((s,r)=>s+r.ms,0)/rec.length:5000,o={};
  for(const k in m){const e=m[k];o[k]=(e.w+.5)/(e.n+2)*3+Math.min(1,Math.max(0,e.ms/e.n/g-1))}return o}
function gen(){
  const W=weakMap(),C=[];
  for(let i=0;i<40;i++){
    const op=S.set.op=='mix'?(Math.random()<.5?'+':'-'):S.set.op,da=rnd(Math.max(1,S.set.d-1),S.set.d),db=rnd(1,da);
    let a=num(da),b=num(db);if(op=='-'&&b>a)[a,b]=[b,a];
    C.push({a,b,o:op,sc:[...tags(a,b,op)].reduce((s,k)=>s+(W[k]??.3),0)})}
  if(!S.set.ai||S.h.length<10||Math.random()<.15)return C[0];
  C.sort((x,y)=>y.sc-x.sc);return C[Math.floor(Math.random()**2*8)]}
const L=k=>{const m=k.match(/^s(\d)x(\d)$/);return m?`${m[1]}-digit with ${m[2]}-digit`:/^d\d$/.test(k)?'digit '+k[1]:{carry:'carrying','borrow':'borrowing','+':'addition','-':'subtraction',simple:'no carry or borrow'}[k]||k};
function hint(){if(!S.set.ai||S.h.length<10)return'';const W=weakMap();
  const k=[...tags(cur.a,cur.b,cur.o)].filter(k=>/^d\d$|carry|borrow/.test(k)&&W[k]>=.9).sort((x,y)=>W[y]-W[x])[0];
  return k?'Weak spot: '+L(k):''}
// ---- views
let view='home',sess,cur,t0,inp='',tm,lock=false;
function nav(v){view=v;clearInterval(tm);document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v==(v=='stats'?'stats':'home')));render();$('#main').scrollTop=0}
function render(){({home,quiz,done,stats:statsView}[view])($('#main'))}
const seg=(k,o)=>`<div class=seg>${o.map(([v,l])=>`<button data-k="${k}" data-v="${v}" class="${S.set[k]==v?'on':''}">${l}</button>`).join('')}</div>`;
function home(m){const n=S.h.filter(r=>dk(r.t)==today()).length,g=S.set.goal;
  m.innerHTML=`<h1>MindMath</h1><div class=mu>Solve in your head. No paper.</div>
  <div class='card y'><div class=row><b>Today</b><span>${n} / ${g} questions</span></div><div class=bar><i style="width:${Math.min(100,n/g*100)}%"></i></div></div>
  <div class='card l'><h3>Operation</h3>${seg('op',[['+','Add'],['-','Subtract'],['mix','Mixed']])}
  <h3>Largest number</h3>${seg('d',[[1,'1 digit'],[2,'2 digits'],[3,'3 digits'],[4,'4 digits']])}
  <h3>Questions per set</h3>${seg('len',[[10,'10'],[20,'20'],[30,'30'],[50,'50']])}
  <h3>Daily goal</h3>${seg('goal',[[20,'20'],[50,'50'],[100,'100']])}
  <div class=row style="margin-top:14px"><div><b>Smart mode</b><div class=mu>Repeats the digits you get wrong or solve slowly</div></div><button class="tg ${S.set.ai?'on':''}" data-k=ai></button></div></div>
  <button class=big onclick="start()">Start ${S.set.len} questions</button>`}
function start(){sess={n:0,ok:0,ms:0,T:S.set.len};nextQ();nav('quiz')}
function nextQ(){cur=gen();inp='';lock=false;t0=performance.now()}
function quiz(m){clearInterval(tm);
  m.innerHTML=`<div class=row><span class=mu>Question ${sess.n+1} of ${sess.T}</span><b id=tmr>0.0s</b></div><div class=bar><i style="width:${sess.n/sess.T*100}%"></i></div>
  <div class=hint>${hint()}</div><div class=q>${cur.a} ${cur.o=='+'?'+':'−'} ${cur.b}</div><div class=ans id=ans>&nbsp;</div>
  <div class=pad>${[1,2,3,4,5,6,7,8,9,'⌫',0,'✓'].map(k=>`<button data-p="${k}" class="${k=='✓'?'go':''}">${k}</button>`).join('')}</div>`;
  tm=setInterval(()=>{const e=$('#tmr');if(e&&!lock)e.textContent=((performance.now()-t0)/1000).toFixed(1)+'s'},100)}
function key(k){if(view!='quiz'||lock)return;
  if(k=='⌫')inp=inp.slice(0,-1);else if(k=='✓'||k=='Enter'){if(inp)submit();return}else if(inp.length<6)inp+=k;
  $('#ans').textContent=inp||'\u00a0'}
function submit(){lock=true;const ms=Math.round(performance.now()-t0),c=cur.o=='+'?cur.a+cur.b:cur.a-cur.b,ok=+inp==c;
  S.h.push({t:Date.now(),a:cur.a,b:cur.b,o:cur.o,u:+inp,ok,ms});if(S.h.length>1500)S.h=S.h.slice(-1500);save();
  sess.n++;sess.ok+=ok;sess.ms+=ms;const a=$('#ans');a.className='ans '+(ok?'ok':'bad');if(!ok)a.textContent=inp+' → '+c;
  setTimeout(()=>{if(sess.n>=sess.T)nav('done');else{nextQ();render()}},ok?600:1800)}
function done(m){const acc=Math.round(sess.ok/sess.T*100);
  m.innerHTML=`<h1>${acc>=90?'Excellent set':acc>=70?'Good work':'Keep going'}</h1><div class=mu>Set complete</div>
  <div class=grid><div class=card><b class=n2>${sess.ok}/${sess.T}</b><span class=mu>correct</span></div><div class=card><b class=n2>${(sess.ms/sess.T/1000).toFixed(1)}s</b><span class=mu>average time</span></div></div>
  <div class=card>${sess.ok<sess.T?'Your next questions will lean on the digits you missed.':'Perfect set. Try a larger number size to level up.'}</div>
  <button class=big onclick="start()">Next ${S.set.len} questions</button><button class=ghost onclick="nav('stats')">See my progress</button>`}
function chart(v,col){const W=320,H=110,p=18,f=v.map((x,i)=>x==null?null:[p+i*(W-2*p)/(v.length-1),x]).filter(Boolean),mx=Math.max(...f.map(q=>q[1]),1)*1.15,P=f.map(q=>[q[0],H-p-q[1]/mx*(H-2*p)]);
  return`<svg viewBox="0 0 ${W} ${H}" width="100%">`+(P.length>1?`<polyline fill="none" stroke="${col}" stroke-width="3" stroke-linejoin="round" points="${P.map(q=>q.join(',')).join(' ')}"/>`:'')+P.map(q=>`<circle cx="${q[0]}" cy="${q[1]}" r="4" fill="${col}"/>`).join('')+`<g font-size="10" fill="currentColor" opacity=".55"><text x="${p}" y="${H-3}">14 days ago</text><text x="${W-p}" y="${H-3}" text-anchor="end">today</text></g></svg>`}
function statsView(m){const h=S.h;
  if(h.length<3){m.innerHTML=`<h1>Stats</h1><div class=card>Answer a few questions to see your progress here. Tap Practice to start.</div>`;return}
  const fm=a=>a.reduce((s,r)=>s+r.ms,0)/a.length,fa=a=>a.filter(r=>r.ok).length/a.length,by={};
  h.forEach(r=>(by[dk(r.t)]??=[]).push(r));
  const days=[...Array(14)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()-13+i);return dk(d)});
  const tv=days.map(d=>by[d]?fm(by[d])/1000:null),av=days.map(d=>by[d]?Math.round(fa(by[d])*100):null);
  let st=0,d=new Date();if(!by[dk(d)])d.setDate(d.getDate()-1);while(by[dk(d)]){st++;d.setDate(d.getDate()-1)}
  const n=Math.min(50,Math.floor(h.length/2)),La=h.slice(-n),Pa=h.slice(-2*n,-n);let tr=`<div class=card>Your trend appears after about 20 answers.</div>`;
  if(n>=10){const dt=(fm(Pa)-fm(La))/fm(Pa)*100,da=(fa(La)-fa(Pa))*100;
    tr=`<div class="card trend ${dt>=0&&da>=-3?'up':'dn'}"><b>${dt>=0?'You are getting faster':'Slower than before'}</b><div class=mu>Speed ${dt>=0?'+':''}${dt.toFixed(0)}%, accuracy ${da>=0?'+':''}${da.toFixed(0)} points, compared with your previous ${n} answers.</div></div>`}
  const A=agg(h.slice(-600)),dg=[...Array(10).keys()].map(i=>'d'+i);
  const cell=k=>{const e=A[k];if(!e||e.n<3)return`<div class=cell style="opacity:.45"><b>${k[1]}</b><small>no data</small></div>`;const er=e.w/e.n,hue=Math.round(120*(1-Math.min(1,er*4)));
    return`<div class=cell style="background:hsl(${hue} 65% 45%/.22);border-color:hsl(${hue} 65% 45%)"><b>${k[1]}</b><small>${Math.round((1-er)*100)}% · ${(e.ms/e.n/1000).toFixed(1)}s</small></div>`};
  const row=k=>{const e=A[k];return e?`<div class=row><span>${L(k)}</span><span class=mu>${Math.round((1-e.w/e.n)*100)}% correct · ${(e.ms/e.n/1000).toFixed(1)}s · ${e.n} tries</span></div>`:''};
  const worst=dg.filter(k=>A[k]&&A[k].n>=3).sort((x,y)=>A[y].w/A[y].n-A[x].w/A[x].n||A[y].ms/A[y].n-A[x].ms/A[x].n).slice(0,2).map(k=>k[1]);
  const bad=h.filter(r=>!r.ok).slice(-5).reverse().map(r=>`<div class=row><span>${r.a} ${r.o=='+'?'+':'−'} ${r.b}</span><span class=mu>you: ${r.u} · answer: ${r.o=='+'?r.a+r.b:r.a-r.b}</span></div>`).join('')||'<div class=mu>No mistakes yet.</div>';
  const best=Math.min(...h.filter(r=>r.ok).map(r=>r.ms))/1000;
  m.innerHTML=`<h1>Your progress</h1>${tr}
  <div class=grid><div class=card><b class=n2>${Math.round(fa(h)*100)}%</b><span class=mu>accuracy</span></div><div class=card><b class=n2>${(fm(h)/1000).toFixed(1)}s</b><span class=mu>average time</span></div>
  <div class=card><b class=n2>${st}</b><span class=mu>day streak</span></div><div class=card><b class=n2>${h.length}</b><span class=mu>questions solved</span></div></div>
  <div class='card b'><h3>Average time per question (seconds)</h3>${chart(tv,'#f97316')}<h3>Accuracy per day (%)</h3>${chart(av,'#6366f1')}<div class=mu>Time going down and accuracy staying high means you are improving.</div></div>
  <div class='card g'><h3>Digit heatmap (green is strong, red needs work)</h3><div class=heat>${dg.map(cell).join('')}</div>${worst.length?`<p class=mu>Toughest digits right now: ${worst.join(' and ')}. Smart mode is drilling these.</p>`:''}</div>
  <div class='card l'><h3>By type</h3>${['carry','borrow','simple','+','-'].map(row).join('')}</div>
  <div class='card p'><h3>Recent mistakes</h3>${bad}</div>
  <div class='card y'><div class=row><span>Fastest correct answer</span><b>${best.toFixed(1)}s</b></div></div>
  <button class=ghost onclick="if(confirm('Delete all progress?')){S.h=[];save();render()}">Reset all data</button>`}
$('#main').onclick=e=>{const p=e.target.closest('[data-p]');if(p)return key(p.dataset.p);
  const b=e.target.closest('[data-k]');if(!b)return;const k=b.dataset.k,v=b.dataset.v;
  S.set[k]=v===undefined?!S.set[k]:(isNaN(v)?v:+v);save();render()};
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>nav(b.dataset.v));
addEventListener('keydown',e=>{if(/^\d$/.test(e.key)||e.key=='Enter')key(e.key);else if(e.key=='Backspace')key('⌫')});
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
render();
</script></body></html>
